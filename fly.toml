# Mediavida mobile backend — reverse-engineered MV REST API for the Flutter app.
app = "mediavida-api"
primary_region = "cdg"

[build]

[env]
  BASE_URL = "https://mediavida-api.fly.dev"
  # Go soft memory cap: make the runtime GC hard as it approaches the limit
  # instead of letting the heap grow until the kernel OOM-kills the process.
  # An OOM on one voter destabilizes the whole 3-node Raft cluster (health
  # flaps everywhere → app gets 503s → "loads forever"). Kept under the VM
  # size to leave room for goroutine stacks, BoltDB mmap and OS/page cache.
  GOMEMLIMIT = "200MiB"

# Rolling deploy that keeps Raft quorum: replace at most one node at a time so a
# 3-node cluster never loses more than one voter mid-deploy.
[deploy]
  strategy = "rolling"
  max_unavailable = 1

[http_service]
  internal_port = 8080
  force_https = true
  # Always-on: the server maintains the MV session and polls bubbles for push.
  auto_stop_machines = "off"
  auto_start_machines = true
  # 3-node Raft cluster — keep all voters running for quorum.
  min_machines_running = 3

  # Gate rolling deploys on Colmena readiness: a replacement node only counts as
  # healthy once it has joined Raft and caught up (colmenaStore.Healthy()).
  [[http_service.checks]]
    method = "GET"
    path = "/health"
    interval = "5s"
    timeout = "2s"
    grace_period = "30s"

[[vm]]
  size = "shared-cpu-2x"
  # 256mb is plenty: idle RSS is ~65MB. The earlier OOMs were NOT a real memory
  # need — colmena's jobs queue never purged terminal jobs, so default.db grew
  # to 117MB and every Raft snapshot materialized it (~112MB spikes) until nodes
  # OOM-killed. Fixed at the root by colmena v0.12.1's retention reaper: snapshots
  # dropped to ~5MB, RSS to ~65MB. (Was briefly 1gb as a band-aid before the fix.)
  memory = "256mb"

# Durable Colmena data dir (Raft log + SQLite state) — one volume per machine.
[[mounts]]
  source = "colmena_data"
  destination = "/data"
